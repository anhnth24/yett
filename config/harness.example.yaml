# yett — config mẫu. Copy thành config/harness.yaml rồi điền.
# Secret KHÔNG để trong file này — đặt qua biến môi trường YETT_SECRET_<TÊN IN HOA>.
#   vd: export YETT_SECRET_LLM_KEY="sk-..."

# ---- Provider ----
# Chọn 1 provider. base_url có mặc định theo name (xem provider/registry.py), chỉ khai khi khác.
# Provider hỗ trợ: glm, minimax, openai, anthropic, anthropic_oai, gemini, deepseek, grok, qwen, mistral, groq.
# Secret KHÔNG để trong file — đặt env YETT_SECRET_LLM_KEY. Giá xem config/pricing.yaml.

# GLM 5.2 (Zhipu / Z.ai) — mặc định (endpoint quốc tế api.z.ai):
provider:
  name: glm
  model: glm-5.2                    # hoặc glm-4.6 (rẻ hơn), glm-4.5-air
  # --- Chọn 1 trong 2 cách đặt API key ---
  # Cách A (tiện, local): dán thẳng key vào đây (config này đã gitignored):
  # CẢNH BÁO: key nằm plaintext trên đĩa trong file config. Chỉ dùng cho máy cá nhân/dev.
  # Khuyến nghị dùng Cách B (secret store: file/keyring) — nhất là khi chia sẻ máy hoặc
  # đưa config vào hệ thống backup/đồng bộ.
  api_key: "DÁN_API_KEY_VÀO_ĐÂY"
  # Cách B (an toàn hơn): để tên secret, đặt key ở secrets/llm_key (secret_backend: file)
  # hoặc OS credential manager (secret_backend: keyring) hoặc env YETT_SECRET_LLM_KEY:
  # api_key_secret: llm_key
  max_retries: 4
  # base_url: https://open.bigmodel.cn/api/paas/v4   # bỏ comment nếu dùng endpoint TQ

# MiniMax M3 (bỏ comment, comment GLM ở trên):
# provider:
#   name: minimax
#   model: MiniMax-M3
#   api_key: "DÁN_API_KEY"
#   # base_url mặc định: https://api.minimax.io/v1 (bản TQ: https://api.minimaxi.com/v1)

# base_url có SẴN MẶC ĐỊNH theo name (không cần khai). Muốn đổi thì thêm dòng base_url:
#   glm           -> https://api.z.ai/api/paas/v4   (TQ: https://open.bigmodel.cn/api/paas/v4)
#   minimax       -> https://api.minimax.io/v1      (TQ: https://api.minimaxi.com/v1)
#   deepseek      -> https://api.deepseek.com
#   gemini        -> https://generativelanguage.googleapis.com/v1beta/openai
#   openai        -> https://api.openai.com/v1
#   anthropic     -> https://api.anthropic.com/v1   (Messages API native)
#   anthropic_oai -> https://api.anthropic.com/v1   (OpenAI-compat)
#   grok          -> https://api.x.ai/v1
#   qwen          -> https://dashscope.aliyuncs.com/compatible-mode/v1
#   mistral       -> https://api.mistral.ai/v1
#   openrouter    -> https://openrouter.ai/api/v1
#   groq          -> https://api.groq.com/openai/v1

# Ví dụ khác: DeepSeek / Gemini / OpenAI / Anthropic
#   name: deepseek   model: deepseek-chat
#   name: gemini     model: gemini-2.5-flash
#   name: openai     model: gpt-5.4-mini
#   name: anthropic      model: claude-haiku-4-5   # Messages API native (khuyến nghị)
#   name: anthropic_oai  model: claude-haiku-4-5   # OpenAI-compat endpoint

# Anthropic Messages API native (bỏ comment, comment GLM ở trên):
# provider:
#   name: anthropic
#   model: claude-haiku-4-5
#   api_key_secret: llm_key
#   # base_url mặc định: https://api.anthropic.com/v1

# Provider dự phòng (tuỳ chọn) — failover khi provider chính lỗi cứng:
# fallback_provider:
#   name: minimax
#   model: MiniMax-M3
#   api_key_secret: llm_key_2

budget:
  max_loop_iterations: 20
  context_token_budget: 120000
  monthly_cost_alert_usd: 50

# ---- Complexity router: câu dễ chạy ít vòng → tiết kiệm chi phí ----
# Số vòng theo độ khó; bị chặn trên bởi budget.max_loop_iterations.
router:
  enabled: true
  trivial_steps: 2     # chào hỏi/xác nhận
  simple_steps: 4      # câu hỏi ngắn thông thường
  moderate_steps: 8    # có việc nhiều bước (kiểm tra, điều tra…)
  complex_steps: 20    # phân tích + sửa + deploy, kèm code, câu rất dài

# ---- Project của bạn (trên ổ đĩa Windows, đường dẫn WSL2/container) ----
projects:
  go-learn:
    path: /mnt/d/work/go-learn
  # them-project:
  #   path: /mnt/c/Users/ban/source/project-x

# ---- Database để agent query (chỉ đọc; connection string là secret) ----
# databases:
#   uat:
#     driver: postgres          # postgres | mysql | sqlite | sqlserver
#     dsn_secret: uat_dsn       # đặt env YETT_SECRET_UAT_DSN hoặc secrets/uat_dsn
#     readonly: true
# Nhớ thêm rule allowlist: { tool: db_query, effect: allow } ở mục security bên dưới.

# ---- Kênh Telegram (nhắn tin với yett như trợ lý) ----
# Token lấy từ @BotFather (/newbot). KHÔNG dán token vào đây — đặt qua secret:
#   env:  export YETT_SECRET_TG_BOT_TOKEN="8123...JkLmNo"
#   file: ghi secrets/tg_bot_token  (chmod 600)
# Long-polling → KHÔNG cần mở port; chỉ cần outbound HTTPS + api.telegram.org trong egress.
# channels:
#   telegram:
#     enabled: true
#     token_secret: tg_bot_token       # TÊN secret, không phải token
#     pairing_code: "yett-ghep-2026"   # gửi mã này cho bot để tự ghép (rỗng = tắt pairing)
#     allowed_chat_ids: []             # hoặc điền sẵn chat_id đã biết
#     briefing_hour: 8                 # gửi briefing tự động lúc 8h (theo timezone); bỏ = tắt
#
# ---- Kênh Zalo Official Bot API (KHÔNG phải Zalo Personal / unofficial) ----
# Tạo bot tại https://bot.zaloplatforms.com — token dạng "{id}:{secret}".
# Docs: https://docs.zaloplatforms.com/docs/BOT/apis/getUpdates (poll) /
#       https://docs.zaloplatforms.com/docs/BOT/apis/setWebhook (webhook) /
#       https://docs.zaloplatforms.com/docs/BOT/apis/sendMessage (text ≤2000).
# Secret: export YETT_SECRET_ZALO_BOT_TOKEN="..."  hoặc secrets/zalo_bot_token (600).
# Egress: thêm bot-api.zaloplatforms.com. mode=webhook fail-closed nếu thiếu HTTPS + secret 8–256.
# channels:
#   zalo:
#     enabled: true
#     token_secret: zalo_bot_token
#     pairing_code: "yett-ghep-2026"
#     allowed_chat_ids: []             # chat_id string (có thể hex-like, không chỉ số)
#     mode: poll                       # poll | webhook (getUpdates ⊥ webhook theo docs Zalo)
#     poll_timeout_sec: 30
#     # mode: webhook
#     # webhook_url: "https://example.com/api/channels/zalo/webhook"
#     # webhook_secret: "change-me-8chars-min"
#     # webhook_path: /api/channels/zalo/webhook
#     briefing_hour: 8

# ---- Bật/tắt skills & subagents ----
skills_enabled: true
subagents_enabled: true

# ---- Server SSH (deploy UAT, đọc log). Host lạ → deny; xóa file → cấm tuyệt đối ----
# remote:
#   hosts:
#     uat-app-1:
#       address: 10.0.0.10
#       user: deploy
#       auth: keyfile:uat_key        # đặt private key vào secrets/uat_key
#       tier: uat                    # uat cho deploy; restricted chỉ đọc
#       log_paths: [/var/log/app/*.log]
#       deploy_script: /opt/deploy/run.sh   # lệnh deploy DUY NHẤT được phép (phải duyệt)
# Cần cài: pip install asyncssh

# ---- Sandbox ----
sandbox:
  backend: docker            # docker (Docker Desktop qua WSL2) | local (dev, ít cô lập hơn)
  network: none              # container mặc định không mạng
  timeout_sec: 120
  mem_limit: 2g
  cpus: 2.0

# ---- web_search (Brave Search API; key trong secret store) ----
# search:
#   provider: brave
#   api_key_secret: search_key   # export YETT_SECRET_SEARCH_KEY="BSA..."
# Thêm api.search.brave.com vào egress.allowlist bên dưới. Kết quả URL ngoài allowlist bị lọc.
# Nhớ thêm rule: { tool: web_search, effect: allow } ở security.allowlist.

# ---- Egress allowlist (domain web_fetch/search được phép) ----
egress:
  allowlist:
    - api.z.ai               # GLM (quốc tế)
    - open.bigmodel.cn       # GLM (TQ)
    - api.minimax.io         # MiniMax
    - api.deepseek.com       # DeepSeek
    - generativelanguage.googleapis.com  # Gemini
    - api.openai.com         # OpenAI
    - api.anthropic.com      # Anthropic
    - api.telegram.org       # Kênh Telegram (nếu bật channels.telegram)
    - bot-api.zaloplatforms.com  # Kênh Zalo Official Bot API (nếu bật channels.zalo)
    # - api.search.brave.com # web_search (Brave) — bỏ comment nếu bật search ở trên
    # - github.com

# ---- Security (Policy Gate) ----
security:
  approval_mode: manual      # manual | smart (không có YOLO)
  approval_timeout_sec: 300  # scheduled run: hết hạn approval → fail sạch
  allowlist:
    # Cho phép đọc file trong project + chạy lệnh git/test an toàn:
    - tool: read_file
      effect: allow
    - tool: write_file
      effect: allow
    - tool: exec
      # Pattern phải khớp TOÀN BỘ chuỗi cmd (fullmatch, không còn substring/prefix ngầm định
      # — xem allowlist.py/schema.py "anchored matching"). "(\s.*)?$" giữ nguyên ý định gốc
      # "tên lệnh + tham số bất kỳ", chỉ khác là giờ phải khai rõ thay vì search() ngầm cho.
      arg_patterns: { cmd: "^(git|ls|cat|grep|python|pytest|npm|go)(\\s.*)?$" }
      effect: allow
    - tool: load_skill              # cho phép agent nạp hướng dẫn skill
      effect: allow
    - tool: delegate                # cho phép ủy quyền cho subagent
      effect: allow
    # Trợ lý cá nhân: quản lý việc/mục tiêu (ghi vào state riêng của yett, rủi ro thấp)
    - tool: task_add
      effect: allow
    - tool: task_list
      effect: allow
    - tool: task_update
      effect: allow
    # Memory review gate: agent chỉ đề xuất vào staging; duyệt bằng `yett memory approve`
    - tool: memory_propose
      effect: allow
    - tool: notify                  # cho agent chủ động báo qua Telegram (deploy xong, CI đỏ…)
      effect: allow
    # - tool: db_query              # bỏ comment nếu dùng DB (chỉ SELECT — sqlguard đã chặn ghi)
    #   effect: allow
    # Lệnh exec khác → mặc định DENY (fail-closed). Thêm rule nếu cần.

secret_backend: env
timezone: Asia/Ho_Chi_Minh
workspace_root: ./workspace
