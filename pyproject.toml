[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yett"
version = "0.0.1"
description = "Agent harness cho môi trường on-prem — fail-closed, dữ liệu tại chỗ, deploy-per-tenant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "yett contributors" }]

# Deps PIN EXACT (chính sách supply-chain — xem harness-master-plan.md).
dependencies = [
  "pydantic==2.13.4",
  "pyyaml==6.0.2",
  "sqlglot==30.12.0",
  "keyring==25.6.0",
  "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "mypy==1.14.1",
  "ruff==0.9.2",
  "import-linter==2.1",
]

[project.scripts]
yett = "yett.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yett"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E702 (nhiều statement/dòng bằng ';') vô hại trong test cleanup như store.close(); ckpt.close()
ignore = ["E702"]

[tool.mypy]
python_version = "3.11"
strict = true
# Tắt 2 cờ gây nhiễu cho code có nhiều callable injected + dict payload động;
# phần còn lại của strict (None-safety, incompatible types, no-any-return...) vẫn bật.
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
files = ["src/yett"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "yaml.*", "croniter.*", "asyncssh.*", "psycopg.*", "pymysql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 30
timeout_method = "thread"
