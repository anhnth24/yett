name: CI

on:
  push:
    branches: ["claude/harness-reference-architecture-0wwuek"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy src/yett
      - name: Import-linter (bất biến kiến trúc — AG-3)
        env:
          PYTHONPATH: src
          # Windows: import-linter đọc source bằng codec mặc định (charmap) → crash trên file UTF-8
          PYTHONUTF8: "1"
        run: lint-imports
      - name: Pytest
        run: pytest -q
