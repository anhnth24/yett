name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy src/yett
      - name: Import-linter (bất biến kiến trúc — AG-3)
        run: PYTHONPATH=src lint-imports
      - name: Pytest
        run: pytest -q
