# Host yett trên Docker Desktop (Windows/macOS/Linux). 1 stack = 1 instance.
# yett chạy TRONG container Linux → sh/cmdguard/quyền file đúng thiết kế, không lo Windows shell.
services:
  yett:
    build: ..
    image: yett:local
    stdin_open: true          # cho `docker compose run yett chat ...` tương tác
    tty: true
    environment:
      # Có thể truyền key qua env (hoặc dùng secrets/ volume). Đặt trong .env cạnh file này.
      - YETT_SECRET_LLM_KEY=${YETT_SECRET_LLM_KEY:-}
    volumes:
      - ./config:/app/config:ro            # config (read-only = một phần immutable core)
      - yett-state:/app/state              # traces/scheduler/sessions (giữ qua restart)
      - yett-workspace:/app/workspace      # memory file-based
      - yett-secrets:/app/secrets          # secret store (nếu dùng backend file)
      # Mount project của bạn để agent làm việc (đổi đường dẫn Windows của bạn):
      # - "D:/work/duan:/projects/duan"    # rồi khai projects.duan.path=/projects/duan trong config
    restart: unless-stopped
    # exec sandbox: KHUYẾN NGHỊ backend=local trong config khi host kiểu này —
    # container yett CHÍNH LÀ ranh giới cô lập; tránh mount docker.sock (lộ quyền host daemon).

volumes:
  yett-state:
  yett-workspace:
  yett-secrets:
